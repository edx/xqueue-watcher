name: Python CI

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - '**'

jobs:
  run_tests:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        python-version: ['3.12']
    steps:
    - uses: actions/checkout@v4
    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install requirements and Run Tests
      run: make test

    - name: Run Coverage
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

  # Aggregate check required by the master branch ruleset.
  tests:
    needs: run_tests
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Fail unless all run_tests jobs succeeded
      run: test "${{ needs.run_tests.result }}" = "success"
